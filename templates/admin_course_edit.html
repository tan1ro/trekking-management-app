{% extends "base.html" %}
{% block title %}Edit Course{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0 fw-bold">Edit Course: {{ course.code }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin_edit_course', course_id=course.id) }}">
                    <div class="mb-3">
                        <label for="code" class="form-label fw-semibold">Course Code</label>
                        <input type="text" class="form-control text-uppercase" id="code" name="code" value="{{ course.code }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Course Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ course.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ course.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="active" {% if course.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="archived" {% if course.status == 'archived' %}selected{% endif %}>Archived</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{{ url_for('admin_courses') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
