{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-file-earmark-plus me-2"></i>{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin_edit_exam', exam_id=exam.id) if exam else url_for('admin_create_exam') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="course_id" class="form-label fw-semibold">Target Course</label>
                            <select class="form-select" id="course_id" name="course_id" required>
                                {% for c in courses %}
                                <option value="{{ c.id }}" {% if exam and exam.course_id == c.id %}selected{% endif %}>
                                    {{ c.code }} - {{ c.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="exam_type" class="form-label fw-semibold">Examination Type</label>
                            <select class="form-select" id="exam_type" name="exam_type" required>
                                <option value="Viva" {% if exam and exam.exam_type == 'Viva' %}selected{% endif %}>Viva (Interview / Oral Examination)</option>
                                <option value="Project Demo" {% if exam and exam.exam_type == 'Project Demo' %}selected{% endif %}>Project Demo (Demonstration & Code Walkthrough)</option>
                                <option value="Practical" {% if exam and exam.exam_type == 'Practical' %}selected{% endif %}>Practical (Lab / Hands-on)</option>
                                <option value="Assessment" {% if exam and exam.exam_type == 'Assessment' %}selected{% endif %}>Assessment (Evaluation Test)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Examination Title</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ exam.name if exam else '' }}" placeholder="e.g. MAD-1 Level 1 Project Viva (T3 2026)" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="duration" class="form-label fw-semibold">Duration (Minutes)</label>
                            <input type="number" class="form-control" id="duration" name="duration" value="{{ exam.duration if exam else 30 }}" min="5" max="300" required>
                        </div>
                        <div class="col-md-4">
                            <label for="max_marks" class="form-label fw-semibold">Maximum Total Marks</label>
                            <input type="number" step="0.5" class="form-control" id="max_marks" name="max_marks" value="{{ exam.max_marks if exam else 100 }}" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label for="status" class="form-label fw-semibold">Initial Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Draft" {% if exam and exam.status == 'Draft' %}selected{% endif %}>Draft</option>
                                <option value="Slot Creation" {% if exam and exam.status == 'Slot Creation' %}selected{% endif %}>Slot Creation</option>
                                <option value="Booking Open" {% if exam and exam.status == 'Booking Open' %}selected{% endif %}>Booking Open</option>
                                <option value="Closed" {% if exam and exam.status == 'Closed' %}selected{% endif %}>Closed</option>
                                <option value="Completed" {% if exam and exam.status == 'Completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="fw-bold text-primary mb-3"><i class="bi bi-clock-history me-1"></i> Timeline Configuration</h6>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="slot_creation_start" class="form-label">Examiner Slot Creation Start</label>
                            <input type="datetime-local" class="form-control" id="slot_creation_start" name="slot_creation_start" value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_start else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="slot_creation_end" class="form-label">Examiner Slot Creation End</label>
                            <input type="datetime-local" class="form-control" id="slot_creation_end" name="slot_creation_end" value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_end else '' }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="booking_start" class="form-label">Student Slot Booking Start</label>
                            <input type="datetime-local" class="form-control" id="booking_start" name="booking_start" value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_start else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="booking_end" class="form-label">Student Slot Booking End</label>
                            <input type="datetime-local" class="form-control" id="booking_end" name="booking_end" value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_end else '' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('admin_exams') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-bold">{{ 'Save Examination' if exam else 'Create Examination & Set Rubrics' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
