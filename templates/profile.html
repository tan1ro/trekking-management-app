{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">My Profile</h5>
                <span class="badge bg-secondary text-uppercase">{{ user.role }}</span>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <input type="text" class="form-control" value="{{ user.email }}" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ user.department or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="contact" class="form-label fw-semibold">Contact</label>
                        <input type="text" class="form-control" id="contact" name="contact" value="{{ user.contact or '' }}">
                    </div>

                    <hr>
                    <h6>Change Password</h6>
                    <div class="mb-3">
                        <label for="new_password" class="form-label small">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" id="new_password" name="new_password">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
