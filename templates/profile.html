{% extends "base.html" %}
{% block title %}User Profile{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>My Profile</h5>
                <span class="badge bg-primary text-uppercase">{{ user.role }}</span>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('profile') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Registered Email (Read-only)</label>
                        <input type="text" class="form-control" value="{{ user.email }}" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ user.department or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="contact" class="form-label fw-semibold">Contact Number</label>
                        <input type="text" class="form-control" id="contact" name="contact" value="{{ user.contact or '' }}">
                    </div>

                    <hr class="my-4">
                    <h6 class="fw-bold text-danger mb-3"><i class="bi bi-key-fill me-1"></i> Change Password</h6>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password (leave blank to keep current)</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-primary fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
