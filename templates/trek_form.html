<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{{ title }}</title>
</head>
<body>
  <h1>{{ title }}</h1>

  <form method="POST">
    <p>
      <label>Trek name</label><br>
      <input type="text" name="name" value="{{ trek.name if trek else '' }}" required>
    </p>
    <p>
      <label>Location</label><br>
      <input type="text" name="location" value="{{ trek.location if trek else '' }}" required>
    </p>
    <p>
      <label>Difficulty</label><br>
      <select name="difficulty">
        {% for level in ["Easy", "Moderate", "Hard"] %}
        <option value="{{ level }}" {% if trek and trek.difficulty == level %}selected{% endif %}>
          {{ level }}
        </option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label>Duration (days)</label><br>
      <input type="number" name="duration" value="{{ trek.duration if trek else '' }}" required>
    </p>
    <p>
      <label>Available slots</label><br>
      <input type="number" name="slots" value="{{ trek.available_slots if trek else '' }}" required>
    </p>
    <p>
      <label>Assigned staff</label><br>
      <select name="staff_id">
        <option value="">No staff</option>
        {% for staff in staff_members %}
        <option value="{{ staff.id }}" {% if trek and trek.staff_id == staff.id %}selected{% endif %}>
          {{ staff.name }}
        </option>
        {% endfor %}
      </select>
    </p>
    <button type="submit">{{ button_text }}</button>
  </form>

  <p><a href="/admin/dashboard">Back</a></p>
</body>
</html>
